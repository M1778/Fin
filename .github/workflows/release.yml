# ADR 0010: the matrix that proves finc builds is the thing that ships it.
#
# Portable archives, named `finc-<semver>-<rust-target-triple>`, because `finn`
# builds the expected asset name from its own build-time target constant.
# Matching on an OS substring alone is the bug in `finn`'s download.rs:62-65
# that hands an arm64 user an x86_64 build; a name carrying both OS and arch
# makes that mismatch impossible rather than merely discouraged.
#
# Every archive unpacks to exactly `bin/finc[.exe]` and `lib/std/**`.  There is
# no version directory inside: `finn` supplies the versioned parent.
#
# On top of the portable archives each platform ships its native installable,
# built in the same job from the same staged tree the archive came from:
# a Windows setup exe (Inno Setup, wrapping the zip's bytes), Ubuntu .deb and
# Fedora .rpm (FHS layout: /usr/bin/finc + /usr/lib/std, which the compiler's
# <exe-dir>/../lib/std rule resolves with no wrapper), and macOS .dmg images
# carrying the same bin/lib tree. Arch Linux is served by the static musl
# tarball -- rolling release plus zero distro coupling beats a snapshot-built
# .pkg (see tools/packaging/PKGBUILD, a wrapper prototype, not a CI product).
# The distro/installer/dmg names never collide with the portable pattern, so
# they stay out of index.json: `finn` keeps reading exactly the portable set.
#
# Each sha256 is published twice -- as an `<asset>.sha256` sidecar next to the
# asset, and inside the version index.  The index is authoritative; the sidecar
# is for a human with curl.  The index is generated here on every release and is
# never hand-maintained, and it is fetched by `finn` at runtime from
# <server>/<repo>/releases/latest/download/index.json.
#
# Supply chain: every target also ships a CycloneDX SBOM
# (`finc-<semver>-<target>.cdx.json`, hashed like every other asset), and the
# assembled release set is attested with SLSA build provenance before anything
# is published.  See docs/supply-chain.md for what a consumer verifies.
name: Release

on:
  push:
    # No trailing wildcard: preflight requires the tag to equal v<CMake
    # version> exactly, and a CMake project VERSION carries no prerelease
    # suffix, so a suffixed tag could only fail there. Prerelease tags stay
    # unmatched rather than burning a matrix that cannot succeed.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated archives as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FIN_BUILD_TYPE: Release

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: uv tool install "conan>=2.4,<3"

      - name: Resolve and check the version
        id: v
        run: |
          # `project(FinCompiler VERSION ...)` in CMakeLists.txt is the only
          # place the compiler's version is written down.  conanfile.py's
          # set_version() reads it from there and Version.hpp consumes the
          # FINC_VERSION macro CMake defines from it, so there is nothing here to
          # keep in step -- only something to confirm.  Reading it twice, once
          # through the recipe and once directly, is what confirms it.
          version="$(conan inspect . -f json \
                     | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          cmake_version="$(sed -n 's/^project(FinCompiler VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ] || [ -z "$cmake_version" ]; then
            echo "::error::could not read the version (conan '$version', CMakeLists '$cmake_version')"
            exit 1
          fi
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::conan reports $version, CMakeLists.txt says $cmake_version"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag does not match project version $version (expected v$version)"
              exit 1
            fi
          else
            tag="v$version"
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing finc $version as $tag (prerelease=$prerelease)"

      - name: Check the release tag is annotated (and signed when verifiable)
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # A lightweight tag points straight at the commit, so there is nothing
          # a signature could be attached to: annotation is a property of the
          # tag object, checkable on any runner, so a missing tag object is a
          # hard failure on a tag run. Rehearsals (`workflow_dispatch`) skip
          # this step entirely.
          #
          # The fetch is unconditional on purpose. On a `push` tag event
          # actions/checkout resolves this ref to the commit (`+<sha>:refs/tags/<tag>`),
          # so the tag object is absent and refs/tags/<tag> dereferences to a
          # commit even when the remote has a signed annotated tag. Refetching
          # the tag ref itself replaces that with the real object.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          kind="$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)"
          case "$kind" in
            tag) ;;
            commit) echo "::error::$TAG is a lightweight tag (points straight at the commit, so no signature can attach); cut releases with: git tag -s $TAG -m '...'"; exit 1 ;;
            *) echo "::error::could not read the tag object for $TAG (git cat-file says '$kind')"; exit 1 ;;
          esac

          # Verifying a signature needs the signer's public key, which a hosted
          # runner does not have. That is a fact about the runner, not about
          # the tag, so it is reported as a notice rather than failing the run.
          if ! command -v gpg >/dev/null 2>&1; then
            echo "::notice::no gpg on this runner; $TAG is annotated (checked) but its signature cannot be evaluated here"
            exit 0
          fi
          if git tag -v "$TAG" > "$RUNNER_TEMP/verify.log" 2>&1; then
            echo "$TAG is signed; git verified it against a public key on this runner:"
            grep -E 'Good signature|using .* key' "$RUNNER_TEMP/verify.log" || true
            exit 0
          fi
          cat "$RUNNER_TEMP/verify.log"
          # One exit code, several meanings.  These say the tag *is* signed by
          # a key this runner cannot evaluate -- its public key is absent, or
          # the tag was signed with an SSH key and no allowedSignersFile names
          # it.  Unverifiable is reported, and is not the same as unsigned.
          if grep -qE 'No public key|public key not found|allowedSignersFile' "$RUNNER_TEMP/verify.log"; then
            echo "::notice::$TAG carries a signature from a key this runner does not have; the annotated check passed but the signature was not evaluated here"
            exit 0
          fi
          echo "::error::$TAG is annotated but carries no signature; a release must prove who cut it (sign it with: git tag -s -f $TAG)"
          exit 1

      - name: Refuse to ship a toolchain with no standard library
        run: |
          # `finn` pins a compiler version per project and lib/std/ ships inside
          # the versioned toolchain directory, so an archive without it is a
          # toolchain that cannot compile anything that imports the standard
          # library.  Failing here is the point.
          if [ ! -d lib/std ] || [ -z "$(find lib/std -name '*.fin' -print -quit)" ]; then
            echo "::error::lib/std/ is missing or contains no .fin files; refusing to build release archives."
            exit 1
          fi
          echo "lib/std contains $(find lib/std -name '*.fin' | wc -l) .fin files"

      - name: Check the Windows installer script
        run: |
          # The .iss can only be compiled by ISCC on a Windows runner, so a
          # typo in its [Code] section otherwise costs a whole Windows rebuild
          # to discover.  Here it costs a second, on Linux.
          python3 .github/scripts/check_installer.py tools/packaging/finc.iss

  build:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            conan_arch: x86_64
            llvm_arch: x86_64
            generator: Ninja
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            conan_arch: armv8
            llvm_arch: x86_64
            generator: Ninja
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            conan_arch: x86_64
            llvm_arch: x86_64
            generator: Ninja
          - target: aarch64-apple-darwin
            runner: macos-15
            conan_arch: armv8
            llvm_arch: x86_64
            generator: Ninja
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            conan_arch: x86_64
            llvm_arch: x86_64
            generator: Ninja
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            conan_arch: armv8
            llvm_arch: aarch64
            generator: Ninja
    env:
      FIN_VERSION: ${{ needs.preflight.outputs.version }}
      FIN_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          # The input is only read by the Windows LLVM step; Linux and macOS
          # rows carry the default so every row names what it enforces.
          llvm-arch: ${{ matrix.llvm_arch }}

      - name: Build
        run: |
          conan profile detect --force
          # --lockfile-out records the graph this build actually resolved; the
          # SBOM below is generated from that file rather than re-derived.
          conan install . \
            --output-folder=build \
            --lockfile-out=conan.lock \
            --build=missing \
            -pr:a=conan/profiles/fin \
            -c tools.cmake.cmaketoolchain:generator=Ninja \
            -s arch=${{ matrix.conan_arch }} \
            -s build_type="$FIN_BUILD_TYPE"
          tc="$(find build -name conan_toolchain.cmake -print | head -n 1)"
          if command -v cygpath >/dev/null; then tc="$(cygpath -m "$(pwd)")/$tc"; else tc="$(pwd)/$tc"; fi
          args=(-S . -B build -G "${{ matrix.generator }}"
                -DCMAKE_TOOLCHAIN_FILE="$tc"
                -DCMAKE_BUILD_TYPE="$FIN_BUILD_TYPE"
                -DFIN_BUILD_TESTS=ON
                -DFIN_WITH_LLVM=ON
                -DFIN_LLVM_MAJOR="$FIN_LLVM_MAJOR"
                -DLLVM_DIR="$LLVM_DIR")
          cmake "${args[@]}"
          cmake --build build --config "$FIN_BUILD_TYPE" --parallel
          ctest --test-dir build --build-config "$FIN_BUILD_TYPE" --output-on-failure --no-tests=error

      - name: Stage the archive layout
        run: |
          rm -rf stage
          cmake --install build --config "$FIN_BUILD_TYPE" --prefix stage
          # The layout is a promise to `finn`, so it is asserted rather than
          # assumed: bin/finc[.exe] plus lib/std/**, and nothing above them.
          if [ ! -f stage/bin/finc ] && [ ! -f stage/bin/finc.exe ]; then
            echo "::error::stage/bin/finc[.exe] is missing after install"
            ls -R stage || true
            exit 1
          fi
          if [ -z "$(find stage/lib/std -name '*.fin' -print -quit 2>/dev/null)" ]; then
            echo "::error::stage/lib/std/**.fin is missing after install"
            ls -R stage || true
            exit 1
          fi
          # The archive name promises an architecture; this reads the machine
          # field out of the binary and refuses to ship a name that lies.
          # MSYS also reports finc.exe as an existing extensionless finc. Python
          # opens the literal path, so choose the actual filename explicitly.
          binary=stage/bin/finc
          if [ "$RUNNER_OS" = Windows ]; then binary=stage/bin/finc.exe; fi
          uv run --no-project python .github/scripts/check_arch.py "$binary" "$FIN_TARGET"
          # Structural portability of the shipped ELF: a non-libc COPY
          # relocation is the defect class that made the 1.0.0 x86_64-gnu
          # artifacts segfault on every host but this one (docs/known-issues.md).
          # `--version` below cannot catch it -- the trap needs a differently
          # linked library to appear, which is exactly what a user has.
          uv run --no-project python .github/scripts/check_elf_copy_relocs.py "$binary"
          uv run --no-project python tests/tools/check_docs.py --finc "$binary"
          # Every artifact class below repackages these same bytes, so the
          # version proof lives here once: the binary that ships answers.
          "$binary" --version
          ls -R stage

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "finc-$FIN_VERSION-$FIN_TARGET.tar.gz" -C stage bin lib

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path stage/bin, stage/lib `
            -DestinationPath "finc-$env:FIN_VERSION-$env:FIN_TARGET.zip" `
            -CompressionLevel Optimal

      - name: Windows installer
        if: runner.os == 'Windows'
        env:
          # `run:` on a Windows runner is Git Bash, and Git Bash rewrites any
          # argument that begins with `/` into a Windows path before calling a
          # native .exe. Inno Setup's switches would all arrive rewritten, so
          # ISCC counted several "script filenames" and quit instantly with
          # "You may not specify more than one script filename."
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # Inno Setup wraps the portable zip's bytes -- the same stage/ tree,
          # plus an optional PATH entry. No custom installer code; the script
          # is tools/packaging/finc.iss and the version comes from /D defines.
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then choco install innosetup -y --no-progress; fi
          [ -x "$iscc" ] || { echo "::error::ISCC.exe not found after install"; exit 1; }
          # Same check preflight runs on Linux; repeated here so this job does
          # not depend on another job having run it.
          uv run --no-project python .github/scripts/check_installer.py tools/packaging/finc.iss
          case "$FIN_TARGET" in
            aarch64*) fin_arch=arm64 ;;
            *) fin_arch=x64compatible ;;
          esac
          root="$(cygpath -w "$(pwd)")"
          "$iscc" "/DFinVersion=$FIN_VERSION" "/DFinTarget=$FIN_TARGET" \
            "/DFinArch=$fin_arch" "/DRepoRoot=$root" "/O$root" tools/packaging/finc.iss
          # Proof: silent-install to a scratch dir and run what it installed.
          setup="finc-$FIN_VERSION-$FIN_TARGET-setup.exe"
          [ -f "$setup" ] || { echo "::error::$setup was not produced"; exit 1; }
          dest="$(cygpath -u "$RUNNER_TEMP")/finc-install-test"
          rm -rf "$dest"
          "./$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$(cygpath -w "$dest")"
          "$dest/bin/finc.exe" --version

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          # The dmg carries the same bin/finc + lib/std tree as the tarball,
          # so the compiler's <exe-dir>/../lib/std rule holds wherever the
          # user drags it. Proved by attaching and running what is inside.
          bash tools/packaging/build-dmg.sh stage "$FIN_VERSION" "$FIN_TARGET" \
            "finc-$FIN_VERSION-$FIN_TARGET.dmg"
          mnt="$(mktemp -d)"
          hdiutil attach "finc-$FIN_VERSION-$FIN_TARGET.dmg" \
            -mountpoint "$mnt" -nobrowse
          "$mnt/finc-$FIN_VERSION-$FIN_TARGET/bin/finc" --version
          hdiutil detach "$mnt"

      - name: Linux distro packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # The LLVM runtime dependency is read off the binary, not guessed: a
          # shared libLLVM names the distro runtime package, a static link
          # means no dependency line at all (the musl tarball's case).
          deb_dep=""; rpm_dep=""
          if ldd stage/bin/finc | grep -q 'libLLVM'; then
            deb_dep="libllvm22"; rpm_dep="llvm-libs"
          fi
          echo "LLVM runtime deps: deb='$deb_dep' rpm='$rpm_dep'"
          # Both packages claim the same thing: `/usr/bin/finc` resolves its
          # bundled library as `<exe-dir>/../lib/std`, which is `/usr/lib/std`
          # once installed. A file with no imports -- tests/samples/basic.fin,
          # which this step used to compile -- cannot show that: it type-checks
          # and links against a package with no stdlib at all. This program
          # imports two symbols out of `lib/std/stdio.fin`, links them with the C
          # driver, and prints the result, so a package that lost `/usr/lib/std`
          # fails here instead of in a user's build.
          cat > finc-package-proof.fin <<'PROOF'
          import { println_str, println_int } from stdio::std;

          fun main() <noret> {
              let n <int> = 6 * 7;
              println_str("fin");
              println_int(n);
          }
          PROOF
          bash tools/packaging/build-deb.sh stage "$FIN_VERSION" "$FIN_TARGET" \
            "finc-$FIN_VERSION-$FIN_TARGET.deb" "$deb_dep"
          # Proof without root: unpack the deb and run what it installs, from
          # a foreign directory so the bundled stdlib has to resolve through
          # the installed /usr/bin -> /usr/lib/std layout.
          dpkg-deb --info "finc-$FIN_VERSION-$FIN_TARGET.deb"
          rm -rf deb-test && mkdir deb-test
          dpkg-deb -x "finc-$FIN_VERSION-$FIN_TARGET.deb" deb-test
          ./deb-test/usr/bin/finc --version
          prove="$(mktemp -d)"
          cp finc-package-proof.fin "$prove/"
          ( cd "$prove" \
            && "$GITHUB_WORKSPACE/deb-test/usr/bin/finc" -o proof finc-package-proof.fin \
            && [ "$(./proof)" = "$(printf 'fin\n42')" ] )
          # The .rpm needs rpmbuild, which Ubuntu does not ship: install it the
          # same way any other build tool is installed here, with retries.
          retry() { local n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; sleep $((n*10)); done; }
          retry sudo apt-get install -y rpm cpio
          bash tools/packaging/build-rpm.sh stage "$FIN_VERSION" "$FIN_TARGET" \
            "finc-$FIN_VERSION-$FIN_TARGET.rpm" "$rpm_dep"
          rpm -qlp "finc-$FIN_VERSION-$FIN_TARGET.rpm"
          rm -rf rpm-test && mkdir rpm-test
          ( cd rpm-test && rpm2cpio "../finc-$FIN_VERSION-$FIN_TARGET.rpm" | cpio -idmv )
          ./rpm-test/usr/bin/finc --version
          # Same proof as the deb's: the extracted FHS tree must compile and run
          # a program that imports from `lib/std`, not merely answer --version.
          prove_rpm="$(mktemp -d)"
          cp finc-package-proof.fin "$prove_rpm/"
          ( cd "$prove_rpm" \
            && "$GITHUB_WORKSPACE/rpm-test/usr/bin/finc" -o proof finc-package-proof.fin \
            && [ "$(./proof)" = "$(printf 'fin\n42')" ] )

      - name: CycloneDX SBOM (Conan graph)
        uses: anchore/sbom-action@v0.24.3
        with:
          # syft's conan cataloger reads conan.lock, which the Build step above
          # wrote from the graph it actually resolved: fmt for the driver and
          # gtest for the suite. LLVM is not a Conan dependency (see
          # conanfile.py), so the next step adds it from the toolchain that
          # compiled the binary.
          file: conan.lock
          format: cyclonedx-json
          output-file: finc-${{ env.FIN_VERSION }}-${{ matrix.target }}.cdx.json
          # The action's default syft is pinned inside the action, and the
          # matrix is heterogeneous (Windows arm64 included), so a version
          # override here would be an untested combination. The archive upload
          # below already covers this file; a second artifact of the same bytes
          # and no release-asset upload keeps the release asset set exactly what
          # publish expects.
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Describe the build in the SBOM
        run: |
          sbom="finc-$FIN_VERSION-$FIN_TARGET.cdx.json"
          # The toolchain that compiled finc, asked rather than assumed. Each
          # install puts llvm-config somewhere else: apt names it
          # llvm-config-<major>, Homebrew ships it unlinked inside the keg, and
          # the Windows tarball puts it on PATH. Falls back to the pin the
          # toolchain action exported, so this never guesses.
          llvm_config=""
          for candidate in "llvm-config" "llvm-config-$FIN_LLVM_MAJOR" \
                           "${LLVM_DIR:+$(dirname "$LLVM_DIR")/../../bin/llvm-config}"; do
            if [ -n "$candidate" ] && "$candidate" --version >/dev/null 2>&1; then
              llvm_config="$candidate"
              break
            fi
          done
          llvm_version="$("$llvm_config" --version 2>/dev/null || true)"
          llvm_version="${llvm_version:-${FIN_LLVM_VERSION:-$FIN_LLVM_MAJOR}}"
          case "$RUNNER_OS" in
            Linux)   llvm_source="apt.llvm.org llvm-toolchain-$FIN_LLVM_MAJOR" ;;
            macOS)   llvm_source="Homebrew llvm@$FIN_LLVM_MAJOR" ;;
            Windows) llvm_source="llvm-project llvmorg-$FIN_LLVM_VERSION tarball" ;;
            *)       llvm_source="unknown" ;;
          esac
          echo "LLVM $llvm_version from $llvm_source (probed ${llvm_config:-nothing})"
          # An SBOM that silently lists no dependency is worse than no SBOM, so
          # the scan is asserted to have found both Conan packages first.
          for dep in fmt gtest; do
            jq -e --arg dep "$dep" 'any(.components[]; .name == $dep)' "$sbom" >/dev/null \
              || { echo "::error::$sbom has no $dep component; conan.lock was not catalogued"; cat "$sbom"; exit 1; }
          done
          # syft names the scanned file as the subject; the subject here is the
          # compiler build, which also carries toolchain facts no lockfile has.
          # Keep in step with the same rewrite in build-musl.
          jq --arg v "$FIN_VERSION" --arg t "$FIN_TARGET" \
             --arg bt "$FIN_BUILD_TYPE" --arg lv "$llvm_version" --arg ls "$llvm_source" '
             .metadata.component = {"bom-ref": "pkg:generic/finc@\($v)?target=\($t)",
                                    "type": "application", "name": "finc", "version": $v}
             | .metadata.properties = ((.metadata.properties // [])
                 + [{"name": "finc:build:target", "value": $t},
                    {"name": "finc:build:type", "value": $bt},
                    {"name": "finc:build:llvm-version", "value": $lv},
                    {"name": "finc:build:llvm-source", "value": $ls}])
             | .components = ((.components // [])
                 | map(select((.type == "file" and (.name | endswith("conan.lock"))) | not))
                 + [{"type": "library", "name": "llvm", "version": $lv,
                     "purl": "pkg:generic/llvm@\($lv)"}])
            ' "$sbom" > "$sbom.tmp"
          mv "$sbom.tmp" "$sbom"
          jq -e --arg t "$FIN_TARGET" '.bomFormat == "CycloneDX"
             and (any(.metadata.properties[]; .name == "finc:build:target" and .value == $t))
             and (any(.components[]; .name == "llvm"))' "$sbom" >/dev/null \
            || { echo "::error::$sbom does not describe build $FIN_TARGET"; cat "$sbom"; exit 1; }
          jq -r '.components[] | "  \(.name) \(.version // "-")"' "$sbom"

      - name: Checksum
        run: |
          # Every shippable asset gets a sidecar, portable or native alike.
          if command -v sha256sum >/dev/null; then
            sum() { sha256sum "$1"; }
          else
            sum() { shasum -a 256 "$1"; }
          fi
          for asset in finc-"$FIN_VERSION"-*; do
            case "$asset" in *.sha256) continue ;; esac
            sum "$asset" > "$asset.sha256"
            cat "$asset.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          if-no-files-found: error
          path: |
            finc-*.tar.gz
            finc-*.zip
            finc-*.deb
            finc-*.rpm
            finc-*-setup.exe
            finc-*.dmg
            finc-*.cdx.json
            finc-*.sha256

  # musl is built inside an Alpine container rather than on the host, so the
  # binary a user downloads has no glibc in it at all.  Docker rather than
  # `container:` so that checkout and artifact upload stay on the host runner.
  build-musl:
    name: x86_64-unknown-linux-musl
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      FIN_VERSION: ${{ needs.preflight.outputs.version }}
      FIN_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Build and stage in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -eux -c '
            apk add --no-cache build-base cmake ninja bison flex flex-dev \
                               python3 uv git perl linux-headers llvm22-dev llvm22-static llvm22-gtest \
                               zlib-static zstd-static libxml2-static libffi-dev curl-static
            uv tool install "conan>=2.4,<3"
            export PATH="$HOME/.local/bin:$PATH"
            conan profile detect --force
            conan install . --output-folder=build-musl --build=missing \
              --lockfile-out=conan.lock \
              -pr:a=conan/profiles/fin -s build_type=Release
            tc="$(find build-musl -name conan_toolchain.cmake -print | head -n 1)"
            cmake -S . -B build-musl -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="/src/$tc" \
              -DCMAKE_BUILD_TYPE=Release \
              -DFIN_BUILD_TESTS=ON \
              -DFIN_WITH_LLVM=ON -DFIN_LLVM_MAJOR=22 \
              -DLLVM_DIR="$(llvm-config-22 --cmakedir)" \
              -DFIN_STATIC_LLVM=ON -DCMAKE_EXE_LINKER_FLAGS=-static
            cmake --build build-musl --parallel 2
            ctest --test-dir build-musl --output-on-failure --no-tests=error
            rm -rf stage-musl
            cmake --install build-musl --prefix stage-musl
            if readelf -l stage-musl/bin/finc | grep -q INTERP; then
              echo "musl compiler unexpectedly needs a dynamic loader"; exit 1
            fi
            uv run --no-project tests/tools/check_docs.py --finc stage-musl/bin/finc
          '
          if [ ! -f stage-musl/bin/finc ]; then
            echo "::error::stage-musl/bin/finc is missing after install"
            exit 1
          fi
          if [ -z "$(find stage-musl/lib/std -name '*.fin' -print -quit 2>/dev/null)" ]; then
            echo "::error::stage-musl/lib/std/**.fin is missing after install"
            exit 1
          fi
          python3 .github/scripts/check_arch.py stage-musl/bin/finc "$FIN_TARGET"
          # Static musl has no shared libLLVM to copy from, so this must pass
          # trivially -- the assertion is here so a future change that
          # reintroduces dynamic linking into this lane is caught by name.
          python3 .github/scripts/check_elf_copy_relocs.py stage-musl/bin/finc
          stage-musl/bin/finc --version

      - name: CycloneDX SBOM (Conan graph)
        uses: anchore/sbom-action@v0.24.3
        with:
          # conan.lock came out of the Alpine container in the step above, so
          # the scan reads the same graph the musl binary was built against.
          file: conan.lock
          format: cyclonedx-json
          output-file: finc-${{ env.FIN_VERSION }}-${{ env.FIN_TARGET }}.cdx.json
          # Same reasoning as the build job: the action's pinned default syft,
          # no second artifact, no release upload.
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Describe the build in the SBOM
        run: |
          sbom="finc-$FIN_VERSION-$FIN_TARGET.cdx.json"
          for dep in fmt gtest; do
            jq -e --arg dep "$dep" 'any(.components[]; .name == $dep)' "$sbom" >/dev/null \
              || { echo "::error::$sbom has no $dep component; conan.lock was not catalogued"; cat "$sbom"; exit 1; }
          done
          # The Alpine LLVM the container installed is the toolchain here, and
          # it is static, so no distro runtime package is implied. Keep in step
          # with the same rewrite in the build job.
          jq --arg v "$FIN_VERSION" --arg t "$FIN_TARGET" --arg bt "$FIN_BUILD_TYPE" '
             .metadata.component = {"bom-ref": "pkg:generic/finc@\($v)?target=\($t)",
                                    "type": "application", "name": "finc", "version": $v}
             | .metadata.properties = ((.metadata.properties // [])
                 + [{"name": "finc:build:target", "value": $t},
                    {"name": "finc:build:type", "value": $bt},
                    {"name": "finc:build:llvm-version", "value": "22"},
                    {"name": "finc:build:llvm-source", "value": "Alpine llvm22-static (static link)"}])
             | .components = ((.components // [])
                 | map(select((.type == "file" and (.name | endswith("conan.lock"))) | not))
                 + [{"type": "library", "name": "llvm", "version": "22",
                     "purl": "pkg:apk/alpine/llvm22-static@22"}])
            ' "$sbom" > "$sbom.tmp"
          mv "$sbom.tmp" "$sbom"
          jq -e --arg t "$FIN_TARGET" '.bomFormat == "CycloneDX"
             and (any(.metadata.properties[]; .name == "finc:build:target" and .value == $t))
             and (any(.components[]; .name == "llvm"))' "$sbom" >/dev/null \
            || { echo "::error::$sbom does not describe build $FIN_TARGET"; cat "$sbom"; exit 1; }

      - name: Archive and checksum
        run: |
          asset="finc-$FIN_VERSION-$FIN_TARGET.tar.gz"
          sudo chown -R "$(id -u):$(id -g)" stage-musl
          tar -czf "$asset" -C stage-musl bin lib
          # The SBOM is hashed like every other asset so publish's allow-list
          # and its `sha256sum -c` cover it too.
          for f in "$asset" finc-"$FIN_VERSION"-"$FIN_TARGET".cdx.json; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: asset-x86_64-unknown-linux-musl
          if-no-files-found: error
          path: |
            finc-*.tar.gz
            finc-*.cdx.json
            finc-*.sha256

  publish:
    name: publish
    needs: [preflight, build, build-musl]
    runs-on: ubuntu-24.04
    # Job-level because only this job signs (`id-token` mints the OIDC token)
    # and only this job records the attestation. `contents: write` is repeated
    # here because a job-level block replaces the workflow-level one wholesale.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      FIN_VERSION: ${{ needs.preflight.outputs.version }}
      FIN_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Check that all twenty assets are present and intact
        run: |
          cd dist
          expected="
          finc-$FIN_VERSION-x86_64-unknown-linux-gnu.tar.gz
          finc-$FIN_VERSION-aarch64-unknown-linux-gnu.tar.gz
          finc-$FIN_VERSION-x86_64-unknown-linux-musl.tar.gz
          finc-$FIN_VERSION-x86_64-apple-darwin.tar.gz
          finc-$FIN_VERSION-aarch64-apple-darwin.tar.gz
          finc-$FIN_VERSION-x86_64-pc-windows-msvc.zip
          finc-$FIN_VERSION-aarch64-pc-windows-msvc.zip
          finc-$FIN_VERSION-x86_64-unknown-linux-gnu.deb
          finc-$FIN_VERSION-x86_64-unknown-linux-gnu.rpm
          finc-$FIN_VERSION-x86_64-pc-windows-msvc-setup.exe
          finc-$FIN_VERSION-aarch64-pc-windows-msvc-setup.exe
          finc-$FIN_VERSION-x86_64-apple-darwin.dmg
          finc-$FIN_VERSION-aarch64-apple-darwin.dmg
          finc-$FIN_VERSION-x86_64-unknown-linux-gnu.cdx.json
          finc-$FIN_VERSION-aarch64-unknown-linux-gnu.cdx.json
          finc-$FIN_VERSION-x86_64-unknown-linux-musl.cdx.json
          finc-$FIN_VERSION-x86_64-apple-darwin.cdx.json
          finc-$FIN_VERSION-aarch64-apple-darwin.cdx.json
          finc-$FIN_VERSION-x86_64-pc-windows-msvc.cdx.json
          finc-$FIN_VERSION-aarch64-pc-windows-msvc.cdx.json
          "
          missing=0
          for f in $expected; do
            if [ ! -f "$f" ]; then echo "::error::missing asset $f"; missing=1; fi
            if [ ! -f "$f.sha256" ]; then echo "::error::missing sidecar $f.sha256"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # An asset nobody expected is as much of a problem as a missing one:
          # `finn` matches on the name, so a stray name is a name it may pick.
          for f in *; do
            case "$f" in
              *.sha256) continue ;;
            esac
            echo "$expected" | tr -s '[:space:]' '\n' | grep -qx "$f" || {
              echo "::error::unexpected asset $f"; exit 1; }
          done
          cat ./*.sha256 | sha256sum -c -
          ls -l

      - name: Generate the version index
        run: |
          # The index is generated from the assets that were just built, plus the
          # index attached to the previous release.  Nothing here is edited by
          # hand, so the index cannot disagree with what shipped.
          mkdir -p prev
          gh release download --pattern index.json --dir prev 2>/dev/null \
            || echo "no previous index.json; starting a new index"
          python3 .github/scripts/build_index.py \
            --version "$FIN_VERSION" \
            --tag "$FIN_TAG" \
            --prerelease "${{ needs.preflight.outputs.prerelease }}" \
            --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/$FIN_TAG" \
            --dist dist \
            --previous prev/index.json \
            --output index.json
          cat index.json

      - name: Attest the release assets
        # Same gate as the release itself: an attestation exists for bytes that
        # were published, never for a rehearsal nobody can download.
        if: github.ref_type == 'tag' || inputs.publish
        uses: actions/attest-build-provenance@v4
        with:
          # Exactly what `gh release create` uploads below: the validated dist/
          # set plus the generated index. Nothing in, nothing out.
          subject-path: |
            dist/*
            index.json

      - name: Create the release
        if: github.ref_type == 'tag' || inputs.publish
        run: |
          # install.sh's own sum, from the exact bytes this tag carries, so a
          # reader can verify the file install.sh pins (issue #88). The script
          # frozen at this tag is what the README's raw URL serves at this tag.
          install_sh="$(sha256sum install.sh | cut -d' ' -f1)"
          notes="finc $FIN_VERSION

          Portable archives (\`finc-<version>-<target>\`) unpack to \`bin/finc[.exe]\`
          and \`lib/std/\`. Native installables: Windows setup exe (per arch),
          Ubuntu .deb and Fedora .rpm (\`finc-<version>-x86_64-unknown-linux-gnu.*\`;
          install with \`apt\`/\`dnf\`), macOS .dmg per arch. Arch Linux: use the
          static musl tarball (no distro coupling) with tools/packaging/PKGBUILD.
          Verify a download with its \`.sha256\` sidecar; \`index.json\` carries the
          authoritative sums and is what \`finn\` reads (portable archives only).

          install.sh for this release —
          https://raw.githubusercontent.com/M1778/Fin/$FIN_TAG/install.sh —
          has sha256 \`$install_sh\`. The installer pins this tag and prints the
          commit it compiled; details in INSTALL.md."
          flags=()
          if [ "${{ needs.preflight.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$FIN_TAG" --target "$GITHUB_SHA" \
            --title "finc $FIN_VERSION" \
            --notes "$notes" \
            "${flags[@]}" \
            dist/* index.json

      - uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: |
            dist/*
            index.json
