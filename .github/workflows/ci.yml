name: CI

on:
  push:
    branches: [master, wave3-semantics]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash on every runner, Windows included, so there is one script per step
    # rather than one per operating system.
    shell: bash

permissions:
  contents: read

env:
  FIN_BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every platform reports, because "which platforms are broken" is the
      # question this matrix exists to answer.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            conan_arch: x86_64
            generator: Ninja
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            conan_arch: armv8
            generator: Ninja
          - name: macos-arm64
            runner: macos-15
            conan_arch: armv8
            generator: Ninja
          - name: macos-x86_64
            runner: macos-15-intel
            conan_arch: x86_64
            generator: Ninja
          - name: windows-x86_64
            runner: windows-2022
            conan_arch: x86_64
            tar_arch: x86_64
            generator: Visual Studio 17 2022
            vs_platform: x64
          - name: windows-arm64
            runner: windows-11-arm
            conan_arch: armv8
            tar_arch: aarch64
            generator: Visual Studio 17 2022
            vs_platform: ARM64

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          llvm-arch: ${{ matrix.tar_arch || 'x86_64' }}

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.name }}-${{ hashFiles('conanfile.py', 'conan/profiles/fin') }}
          restore-keys: conan-${{ matrix.name }}-

      - name: Conan install
        run: |
          # conan/profiles/fin does `include(default)`, so a detected default
          # profile has to exist first.  It records this machine's compiler,
          # which is why it is detected here and not committed.
          conan profile detect --force
          conan profile show -pr:a=conan/profiles/fin
          conan install . \
            --output-folder=build \
            --build=missing \
            -pr:a=conan/profiles/fin \
            -s arch=${{ matrix.conan_arch }} \
            -s build_type="$FIN_BUILD_TYPE"

      - name: Locate the Conan toolchain
        run: |
          # Single-config generators put generators/ under build/build/<config>/,
          # multi-config ones under build/build/.  Find it instead of guessing.
          tc="$(find build -name conan_toolchain.cmake -print | head -n 1)"
          if [ -z "$tc" ]; then
            echo "::error::conan_toolchain.cmake was not generated under build/"
            exit 1
          fi
          if command -v cygpath >/dev/null; then
            tc="$(cygpath -m "$(pwd)")/$tc"
          else
            tc="$(pwd)/$tc"
          fi
          echo "FIN_TOOLCHAIN=$tc" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # FIN_WITH_LLVM and FIN_LLVM_MAJOR are both passed even though
          # CMakeLists.txt defaults to the same values.  The point is that the
          # matrix names what it enforces: an edit to either default then changes
          # the local build without silently changing what CI proves.
          args=(-S . -B build
                -G "${{ matrix.generator }}"
                -DCMAKE_TOOLCHAIN_FILE="$FIN_TOOLCHAIN"
                -DCMAKE_BUILD_TYPE="$FIN_BUILD_TYPE"
                -DFIN_WITH_LLVM=ON
                -DFIN_LLVM_MAJOR="$FIN_LLVM_MAJOR"
                -DLLVM_DIR="$LLVM_DIR")
          if [ -n "${{ matrix.vs_platform }}" ]; then
            args+=(-A "${{ matrix.vs_platform }}")
          fi
          cmake "${args[@]}"

      - name: This build has the pinned backend in it
        run: |
          # Asking for a flag and getting it are different things: a reconfigure
          # keeps cache entries it was not told to change, and the build that
          # started this unit had FIN_WITH_LLVM:BOOL=OFF in a cache nobody read
          # while the suite read 961 passed / 1 failed / 285 skipped (ad795f7),
          # none of which mentioned a backend.  So read it back.
          cache=build/CMakeCache.txt
          got_llvm="$(sed -n 's/^FIN_WITH_LLVM:BOOL=//p' "$cache")"
          got_major="$(sed -n 's/^FIN_LLVM_MAJOR:STRING=//p' "$cache")"
          echo "FIN_WITH_LLVM=$got_llvm FIN_LLVM_MAJOR=$got_major"
          if [ "$got_llvm" != "ON" ]; then
            echo "::error::$cache says FIN_WITH_LLVM=${got_llvm:-<unset>}; this job would have tested a compiler with no backend"
            exit 1
          fi
          if [ "$got_major" != "$FIN_LLVM_MAJOR" ]; then
            echo "::error::$cache says FIN_LLVM_MAJOR=${got_major:-<unset>}, expected $FIN_LLVM_MAJOR"
            exit 1
          fi

      - name: Build
        run: cmake --build build --config "$FIN_BUILD_TYPE" --parallel

      - name: Test
        # No `|| true`, and no continue-on-error.  A corpus sample that is known
        # to fail is the harness's business to declare (an aspirational sample
        # carries an `unimplemented` expectation); silencing ctest here would
        # make the matrix prove nothing, which is the thing ADR 0010 is against.
        #
        # --no-tests=error because an empty test set is a harness failure, not a
        # pass: gtest_discover_tests enumerates by running the binary, so a
        # binary that cannot start registers nothing and ctest would otherwise
        # call that success.
        run: |
          set -o pipefail
          ctest --test-dir build --build-config "$FIN_BUILD_TYPE" \
                --output-on-failure --no-tests=error 2>&1 \
            | tee "$RUNNER_TEMP/ctest.log"

      - name: No codegen test went quiet
        # Runs even when Test failed, which is the case it exists for.  A
        # backend-off build does not merely skip: MachineContract
        # .DashOProducesTheNamedExecutable is not behind BACKEND_TEST and fails,
        # so ctest exits 8, so a step without this condition would be skipped and
        # the job's only visible complaint would be a broken `-o`.
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/ctest.log"
          if [ ! -f "$log" ]; then
            echo "no $log; Test did not get as far as running ctest"
            exit 0
          fi

          # Not a grep for BACKEND_TEST's skip reason ("built with
          # FIN_WITH_LLVM=OFF", tests/test_codegen.cpp:137), which is what this
          # check said first and which cannot work: --output-on-failure prints
          # the output of *failing* tests, a skip is not a failure, and
          # gtest_discover_tests marks these Skipped via SKIP_REGULAR_EXPRESSION
          # so ctest reports "100% tests passed" and never echoes the reason.
          # Verified against a two-test CTest project before being written here.
          #
          # What ctest does print is a trailing block naming every test that did
          # not run, so that is what is read.  295 tests are behind that macro,
          # all of them in a suite ending _Codegen (290 Soundness_Codegen, 3
          # KnownDefect_Codegen, plus 2 written out longhand because their bodies
          # name llvm::DataLayout), so one skipped test from those suites means
          # this job built a compiler with no backend.  Measured locally on such
          # a build: 961 passed, 295 skipped, 1 failed of 1257.  This step is not
          # what turns that job red -- the 1 failure does that on its own -- it is
          # what makes the reason legible, and what still bites on the day that
          # last un-macro'd test starts skipping too.
          #
          # Deliberately keyed on those suites rather than on "nothing skipped at
          # all".  Two module tests skip for honest reasons about the filesystem
          # they are running on -- Soundness_ModuleDiagnostics
          # .AnUnreadableModuleIsNotReportedAsAMissingExport (chmod) and
          # Soundness_ModuleIdentity.AModuleReachedThroughASymlinkIsNotASecond-
          # Module -- and both are expected to skip on Windows.  A check that had
          # to be relaxed on its first contact with a runner is not a check.
          skips="$(sed -n '/The following tests did not run:/,$p' "$log" || true)"
          if [ -n "$skips" ]; then
            echo "Tests that did not run:"
            echo "$skips"
          fi
          quiet="$(printf '%s' "$skips" | grep -cE '[A-Za-z_]+_Codegen\.' || true)"
          if [ "${quiet:-0}" -gt 0 ]; then
            echo "::error::$quiet codegen tests did not run; this build has no backend"
            exit 1
          fi

      - name: finc version and documentation examples
        # An exit criterion in its own right: `finn` reads this to check the
        # version it pinned is the version it got, so a finc that cannot answer
        # is a finc no package manager can drive.
        run: |
          for candidate in "build/finc" "build/finc.exe" \
                           "build/$FIN_BUILD_TYPE/finc" "build/$FIN_BUILD_TYPE/finc.exe"; do
            if [ -x "$candidate" ]; then finc="$candidate"; break; fi
          done
          if [ -z "${finc:-}" ]; then
            echo "::error::no finc binary under build/"
            find build -maxdepth 2 -name 'finc*' || true
            exit 1
          fi
          version="$("$finc" --version)"
          echo "$finc --version -> $version"
          case "$version" in
            finc\ *) ;;
            *) echo "::error::--version printed '$version', which does not start with 'finc '"; exit 1 ;;
          esac
          uv run --no-project python tests/tools/check_docs.py --finc "$finc"

      - name: Upload compiler and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            build/finc
            build/finc.exe
            build/tests/Release/fin_tests.exe
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt

  # The exit criterion is that build.sh runs as committed.  It is a separate job
  # so that a broken build.sh is a distinct red mark from a broken build.
  build-script:
    name: build.sh runs as committed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: ./build.sh --release
        # No --with-llvm.  The backend is build.sh's default now, and this job is
        # the one that proves it: if that default ever goes back to OFF, the
        # script's own cache readback fails here rather than 295 tests skipping
        # quietly.
        run: ./build.sh --release
      - name: This build has the pinned backend in it
        run: |
          got="$(sed -n 's/^FIN_WITH_LLVM:BOOL=//p' build/CMakeCache.txt)"
          echo "FIN_WITH_LLVM=$got"
          [ "$got" = ON ] || { echo "::error::build.sh produced a build with FIN_WITH_LLVM=${got:-<unset>}"; exit 1; }
