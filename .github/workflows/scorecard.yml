name: Scorecard

on:
  # Default branch only: a scorecard for a feature branch measures work in
  # progress, and publish_results would overwrite the badge with it.
  push:
    branches: [master]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        # No moving `v2` tag exists for this action -- only per-release tags,
        # v2.6.0 being the current one -- so `@v2` resolved to nothing and every
        # Scorecard run failed at "unable to find version v2" (run 44796140422).
        # Pinned to the release tag; Dependabot's github-actions ecosystem bumps
        # it like any other pin.
        uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository (verified), so the score can be published and the
          # badge served. Needs id-token: write.
          publish_results: true

      - name: Upload to code scanning
        # v3 and v4 are both supported today; v4 is the one GitHub's README
        # recommends. The repo is public and runs GitHub-hosted runners, so
        # there is no GHES floor holding the pin at v3.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
