name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
      - wave3-semantics
      - wave4-selfhost
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Single Pages channel since 2026-10-20: the site moved from the legacy
# gh-pages source (branch build) to build_type=workflow. Until then every docs
# push deployed the site twice — this workflow armed a deployment of master's
# artifact while the legacy build ran against the gh-pages branch the (hence
# removed) peaceiris step had just pushed — and GitHub allows one in-progress
# deployment at a time, so the legacy run lost with "Due to in progress
# deployment. Please cancel <sha> first". The push step is gone; what deploys
# is the artifact from docs/site, verified against its source below.
permissions:
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Issue #81: docs/site is a checked-in rendering of docs/guide + lib/std,
      # but until a generator exists nothing noticed when it drifted — the site
      # once shipped a #module-memory section for a module the library does not
      # have. Refuse to publish a site that contradicts its source.
      - name: Refuse to publish a site that contradicts its source
        run: python3 tests/tools/check_site.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Directory containing the static documentation site
          path: 'docs/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
